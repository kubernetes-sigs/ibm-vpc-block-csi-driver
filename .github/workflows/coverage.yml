name: Code Coverage
on: [push, pull_request]
jobs:
  test:
    env:
      GOPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
    name: Post
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.26.10"
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
      - name: Install dependencies
        run: |
          go mod download
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.4
      - name: Run vet, lint and format checks
        run: ./hack/verify-all.sh
      - name: Run vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Run Unit tests
        run: |
          go test $(go list ./... | grep -v /vendor/ | grep -v /cmd | grep -v /tests) -race -covermode atomic -coverprofile=covprofile ./...
      - name: Install goveralls
        env:
          GOPATH: ${{ github.workspace }}
        run: go install github.com/mattn/goveralls@latest
      - name: Send coverage
        run: $GOPATH/bin/goveralls -coverprofile=covprofile -service=github
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPATH: ${{ github.workspace }}
